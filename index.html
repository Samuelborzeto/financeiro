<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financeiro da casa</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c8f63">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec;--card:#ffffff;--ink:#16181d;--mut:#737884;--line:#e7e4dd;
  --pos:#0c8f63;--pos-bg:#e2f5ec;--neg:#d6453d;--neg-bg:#fbe9e7;
  --hero:#15171c;--hero-ink:#ffffff;--hero-mut:#9ba1ad;--hero-pos:#4ade9f;--hero-neg:#ff8a80;
  --chip:#e9e6df;--shadow:0 1px 2px rgba(20,20,30,.05),0 8px 24px rgba(20,20,30,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e0f12;--card:#191b21;--ink:#f1f2f4;--mut:#8d93a0;--line:#282b33;
  --pos:#3ecf8e;--pos-bg:#12301f;--neg:#ff7b72;--neg-bg:#3a1a18;
  --hero:#1f222a;--chip:#262930;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.35;padding-bottom:96px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
.mesbar{display:flex;align-items:center;justify-content:space-between}
.mesbar h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.mesbar .nav{display:flex;gap:6px}
.ic{width:38px;height:38px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:18px;font-weight:700;display:grid;place-items:center}
#aviso{font-size:12.5px;color:var(--mut);margin:2px 0 8px}
#aviso:empty{display:none}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px 18px 16px}
.hero .lb{font-size:12.5px;color:var(--hero-mut);font-weight:600}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:4px 0 14px;font-variant-numeric:tabular-nums}
.hero .big.pos{color:var(--hero-pos)} .hero .big.neg{color:var(--hero-neg)}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hstats div{background:rgba(255,255,255,.07);border-radius:14px;padding:9px 10px}
.hstats small{display:block;font-size:11px;color:var(--hero-mut);font-weight:600}
.hstats b{font-size:13.5px;font-variant-numeric:tabular-nums}
.hstats i{display:block;font-style:normal;font-size:10.5px;color:var(--hero-mut);margin-top:1px}

.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:10px}
.card h3{margin:0 0 8px;font-size:13px;font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 6px}
.sec h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.sec span{font-size:12.5px;color:var(--mut);font-weight:600}
.prog{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--pos);border-radius:99px}
.muted{color:var(--mut);font-size:12.5px}

.sim{display:flex;gap:10px;align-items:center}
.sim input{flex:1;min-width:0}
.sim .res{text-align:right;white-space:nowrap}
.sim .res small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.sim .res b{font-size:16px;font-variant-numeric:tabular-nums}

.list{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;color:transparent;font-size:14px;font-weight:800;padding:0}
.chk.on{background:var(--pos);border-color:var(--pos);color:#fff}
.rmain{flex:1;min-width:0;cursor:pointer}
.rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12px;color:var(--mut);margin-top:1px}
.rv{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.rv.pend{color:var(--mut)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--mut);margin-left:4px;vertical-align:1px}
.pbtn{border:0;background:var(--chip);border-radius:8px;font-size:11px;font-weight:700;padding:4px 7px;color:var(--mut)}
.empty{padding:18px;text-align:center;color:var(--mut);font-size:13.5px}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat small{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.stat b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.btn{border:0;border-radius:14px;padding:13px;font-weight:700;background:var(--ink);color:var(--bg);width:100%}
.btn.soft{background:var(--chip);color:var(--ink)}
.btn.danger{background:var(--neg-bg);color:var(--neg)}
.btn:disabled{opacity:.5}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.chip{flex:none;border:0;border-radius:99px;padding:8px 14px;background:var(--chip);font-weight:700;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg)}

.bars{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.bpair{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.bpair i{display:block;width:42%;max-width:18px;border-radius:5px 5px 0 0;min-height:2px}
.bpair .e{background:var(--pos)} .bpair .d{background:var(--neg)}
.bcol small{font-size:10.5px;color:var(--mut);font-weight:600;margin-top:4px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);font-weight:600;margin-top:8px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;font-variant-numeric:tabular-nums}
.tbl th{color:var(--mut);font-weight:600;text-align:right;padding:4px 0}
.tbl td{text-align:right;padding:5px 0;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.hb{margin-top:10px}
.hb .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.hb .top span:last-child{font-variant-numeric:tabular-nums}
.hb .tr{height:8px;background:var(--chip);border-radius:99px;margin-top:4px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--ink);border-radius:99px}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--chip);margin:6px 0 8px}
.split .a{background:var(--ink)} .split .b{background:var(--mut);opacity:.45}

label.f{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--mut)}
input[type=text],input[type=date],input[type=month],input[type=number],select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:15px;font-weight:500}
input:focus,select:focus{outline:none;border-color:var(--ink)}
input[type=file]{font-size:13px;width:100%}
.form{display:grid;gap:11px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.it{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.it:first-child{border-top:0}
.it small{color:var(--mut)}
.it b{white-space:nowrap;font-weight:700}
.gh{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;margin:14px 0 2px}
.itrow{display:grid;grid-template-columns:1fr 84px 30px;gap:6px;margin-bottom:6px}
.itrow select{grid-column:1/3}
.itrow button{grid-row:1/3;grid-column:3;border:0;border-radius:10px;background:var(--neg-bg);color:var(--neg);font-weight:800}
.itbox{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.itbox summary{font-weight:700;font-size:13px;cursor:pointer}
.itbox .info{font-size:12px;font-weight:600;margin-top:4px}
.itbox .info.ok{color:var(--pos)} .itbox .info.aviso{color:var(--neg)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--chip);color:var(--mut)}
.tag.atraso{background:var(--neg-bg);color:var(--neg)}
.pbtn.pg{background:var(--pos-bg);color:var(--pos)}
.cod{display:grid;gap:6px}
.cod .linha{display:flex;gap:8px}
.cod input{flex:1;min-width:0}
.cod .pbtn{padding:0 12px;font-size:12px}
.cod .info{font-size:12px;font-weight:600}
.cod .info.ok{color:var(--pos)}
.cod .info.aviso{color:var(--neg)}
.ia{border:1.5px dashed var(--pos);background:var(--pos-bg);color:var(--pos);border-radius:14px;padding:13px;font-weight:700;text-align:center;display:block;cursor:pointer}
.ia.lendo{opacity:.6;pointer-events:none}
.ck{display:flex;gap:9px;align-items:center;font-size:14px;font-weight:600}
.ck input{width:20px;height:20px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding:6px 6px 10px}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center}
.tab{border:0;background:none;padding:6px 2px;font-size:11px;font-weight:700;color:var(--mut);display:grid;gap:3px;justify-items:center}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.fab{width:54px;height:54px;border-radius:18px;border:0;background:var(--pos);color:#fff;font-size:30px;font-weight:500;line-height:1;margin:-22px auto 0;display:grid;place-items:center;box-shadow:0 8px 20px rgba(12,143,99,.35)}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-card{position:relative;background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:16px 16px 22px;max-height:92vh;overflow:auto}
.sheet-card h2{margin:0 0 12px;font-size:18px;font-weight:800;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center}
.sheet-card h2 button{border:0;background:var(--chip);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.sheet-card img{max-width:100%;border-radius:12px;display:block}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px}
.login[hidden]{display:none}
.login-card{width:100%;max-width:360px;text-align:center}
.login-card h1{margin:0 0 8px;font-size:26px;font-weight:800;letter-spacing:-.03em}
.login-card p{color:var(--mut);margin:0 0 20px}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mesbar">
      <h1 id="mesTitulo"></h1>
      <div class="nav">
        <button class="ic" data-act="mesAnt" aria-label="Mês anterior">&lsaquo;</button>
        <button class="ic" data-act="mesProx" aria-label="Próximo mês">&rsaquo;</button>
      </div>
    </div>
  </header>
  <div id="aviso"></div>
  <main id="view"></main>
</div>

<nav class="tabbar"><div class="in">
  <button class="tab" data-act="aba" data-aba="mes"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Mês</button>
  <button class="tab" data-act="aba" data-aba="fixos"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>Fixos</button>
  <button class="fab" data-act="novo" aria-label="Novo lançamento">+</button>
  <button class="tab" data-act="aba" data-aba="rel"><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Relatórios</button>
  <button class="tab" data-act="aba" data-aba="busca"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Buscar</button>
</div></nav>

<div class="login" id="login"><div class="login-card">
  <h1>Financeiro da casa</h1>
  <p id="loginMsg">Carregando…</p>
  <button class="btn" id="btnGoogle" data-act="google" hidden>Entrar com Google</button>
  <button class="btn soft" id="btnTrocar" data-act="sair" style="margin-top:10px" hidden>Trocar de conta</button>
</div></div>
<div class="sheet" id="sheet" hidden><div class="sheet-bg" data-act="fechar"></div><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast"></div>

<script>
const GRUPOS=['Hortifruti','Carnes e peixes','Laticínios e frios','Padaria','Mercearia','Bebidas','Limpeza','Higiene','Pet','Outros'];
const CATS=['Moradia','Financiamento','Escola','Carro','Mercado','Contas da casa','Saúde','Transporte','Lazer','Impostos','Outros'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtK=v=>{v=Number(v||0);return v>=1000?(v/1000).toFixed(1).replace('.',',')+'k':String(Math.round(v));};
const mesDe=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const hojeISO=()=>{const d=new Date();return mesDe(d)+'-'+pad(d.getDate());};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soma=ls=>ls.reduce((a,l)=>a+Number(l.valor||0),0);
const dataBR=iso=>iso.split('-').reverse().join('/');
const semAcento=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function parseValor(s){s=String(s).trim().replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Number(s);}
function addMes(m,n){const [y,mo]=m.split('-').map(Number);return mesDe(new Date(y,mo-1+n,1));}
function mesNome(m,curto){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1,1);
  if(curto)return d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
  const s=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1);}
function diaNoMes(m,dia){const [y,mo]=m.split('-').map(Number);const ult=new Date(y,mo,0).getDate();return m+'-'+pad(Math.min(Math.max(1,dia),ult));}

/* ---------- estado ---------- */
let lancs=[],recs=[];
let mes=mesDe(new Date()),aba='mes',repN=1,sim='';
let busca={t:'',cat:'',tipo:'todos',de:'',ate:''};
let fs=null,auth=null,unsubs=[],carregado=false;

/* ---------- armazenamento (Firebase) ---------- */
function upsert(arr,o){const i=arr.findIndex(x=>x.id===o.id);if(i>=0)arr[i]=o;else arr.push(o);}
function semId(o){const c=Object.assign({},o);delete c.id;return c;}
const store={
  async save(col,o){
    upsert(col==='lanc'?lancs:recs,o);
    fs.collection(col).doc(o.id).set(semId(o)).catch(()=>toast('Não consegui salvar no servidor. Confira a conexão.'));
  },
  async del(col,id){
    if(col==='lanc')lancs=lancs.filter(x=>x.id!==id);else recs=recs.filter(x=>x.id!==id);
    fs.collection(col).doc(id).delete().catch(()=>toast('Não consegui apagar no servidor. Confira a conexão.'));
  }
};
function aviso(t){$('#aviso').textContent=t||'';}
function tela(modo,email){
  const l=$('#login'),m=$('#loginMsg'),g=$('#btnGoogle'),t=$('#btnTrocar');
  l.hidden=modo==='app';g.hidden=modo!=='login';t.hidden=modo!=='negado';
  if(modo==='login')m.textContent='Entre com sua conta Google para continuar.';
  if(modo==='negado')m.textContent='A conta '+(email||'')+' não tem acesso a este app.';
  if(modo==='config')m.textContent='Falta preencher o arquivo firebase-config.js.';
  if(modo==='carregando')m.textContent='Carregando…';
}
function pararOuvintes(){unsubs.forEach(u=>{try{u();}catch(e){}});unsubs=[];lancs=[];recs=[];carregado=false;window.GEMINI_KEY='';}
function ouvir(email){
  aviso('Carregando dados…');
  const ok={lanc:false,rec:false};
  const timer=setTimeout(()=>{if(!carregado)aviso('Ainda não consegui carregar os dados. Verifique a conexão.');},10000);
  const pronto=()=>{if(ok.lanc&&ok.rec){carregado=true;clearTimeout(timer);aviso('');}};
  const erro=e=>{clearTimeout(timer);if(e&&e.code==='permission-denied')tela('negado',email);else aviso('Não consegui carregar os dados.');};
  unsubs.push(fs.collection('lanc').onSnapshot(sn=>{lancs=sn.docs.map(d=>Object.assign({},d.data(),{id:d.id}));ok.lanc=true;pronto();render();},erro));
  unsubs.push(fs.collection('config').doc('ia').onSnapshot(sn=>{window.GEMINI_KEY=(sn.exists&&sn.data().chave)||'';if(aba==='fixos')render();},()=>{}));
  unsubs.push(fs.collection('rec').onSnapshot(sn=>{recs=sn.docs.map(d=>Object.assign({},d.data(),{id:d.id}));ok.rec=true;pronto();render();},erro));
}
function iniciar(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey)return tela('config');
  try{
    firebase.initializeApp(cfg);auth=firebase.auth();fs=firebase.firestore();
  }catch(e){return tela('config');}
  auth.onAuthStateChanged(u=>{
    pararOuvintes();
    if(!u){tela('login');render();return;}
    tela('app');ouvir(u.email);render();
  });
}
async function entrarGoogle(){
  const prov=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(prov);}
  catch(e){
    if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))auth.signInWithRedirect(prov);
    else if(e&&e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast('Não consegui entrar. Abra o link no Chrome e tente de novo.');
  }
}
const comTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
function comprimir(file){
  return new Promise((ok,err)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      let max=1400,q=.72,out='';
      for(let t=0;t<6;t++){
        const k=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        out=c.toDataURL('image/jpeg',q);
        if(out.length<700000)break;
        max*=.8;q-=.08;
      }
      URL.revokeObjectURL(url);
      out.length<900000?ok(out):err(new Error('grande'));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);err(new Error('img'));};
    im.src=url;
  });
}

/* ---------- cálculos ---------- */
function recAtivos(m){return recs.filter(r=>r.inicio<=m&&(!r.fim||m<=r.fim));}
function calc(m){
  const ls=lancs.filter(l=>l.mes===m);
  const ativos=recAtivos(m).slice().sort((a,b)=>a.dia-b.dia);
  const pago={};
  ls.forEach(l=>{if(l.recId&&ativos.some(r=>r.id===l.recId))pago[l.recId]=l;});
  const pend=ativos.filter(r=>!pago[r.id]);
  const feitos=ls.filter(l=>!l.aberto);
  const hojeM=mesDe(new Date());
  const abertos=lancs.filter(l=>l.aberto&&(l.mes===m||(m===hojeM&&l.mes<m))).sort((a,b)=>a.data.localeCompare(b.data));
  const ent=soma(feitos.filter(l=>l.tipo==='entrada')),desp=soma(feitos.filter(l=>l.tipo==='despesa'));
  const pendEnt=soma(pend.filter(r=>r.tipo==='entrada')),pendFix=soma(pend.filter(r=>r.tipo==='despesa')),totAbertos=soma(abertos);
  const pendDesp=pendFix+totAbertos;
  const avulsos=feitos.filter(l=>!(l.recId&&pago[l.recId]===l)).sort((a,b)=>b.data.localeCompare(a.data));
  return {ls,ativos,pago,ent,desp,pendEnt,pendDesp,pendFix,abertos,totAbertos,avulsos,previsao:ent+pendEnt-desp-pendDesp};
}

    :dataBR(l.data)+(l.categoria?' · '+esc(l.categoria):'')+(l.recId?' · fixo':'');
  return `<div class="row"><div class="rmain" data-act="editLanc" data-id="${esc(l.id)}">
    <div class="rt">${esc(l.descricao)}</div>
    <div class="rs">${sub}</div>${extra||''}</div>
    ${l.itens&&l.itens.length?`<button class="pbtn" data-act="verItens" data-id="${esc(l.id)}">${l.itens.length} itens</button>`:''}
    ${ab?`<button class="pbtn pg" data-act="marcarPago" data-id="${esc(l.id)}">paguei</button>`:''}
    ${l.codigo?`<button class="pbtn" data-act="copiarCod" data-id="${esc(l.id)}">código</button>`:''}
    ${l.printId?`<button class="pbtn" data-act="verPrint" data-id="${esc(l.id)}">print</button>`:''}
    <div class="rv ${ab?(atraso?'neg':'pend'):(e?'pos':'neg')}">${e?'+':'−'} ${fmt(l.valor)}</div></div>`;
}

  ${total?`<div class="list">${fixos}</div><div class="prog"><i style="width:${Math.round(nPago/total*100)}%"></i></div>`

function viewRel(){
  const meses=[];for(let i=repN-1;i>=0;i--)meses.push(addMes(mes,-i));
  const ls=lancs.filter(l=>meses.includes(l.mes)&&!l.aberto);
  const dl=ls.filter(l=>l.tipo==='despesa');
  const ent=soma(ls.filter(l=>l.tipo==='entrada')),desp=soma(dl);
  const cm=[];const nc=Math.max(repN,6);for(let i=nc-1;i>=0;i--)cm.push(addMes(mes,-i));
  const serie=cm.map(m=>{const x=lancs.filter(l=>l.mes===m&&!l.aberto);return {m,e:soma(x.filter(l=>l.tipo==='entrada')),d:soma(x.filter(l=>l.tipo==='despesa'))};});
  const max=Math.max(1,...serie.map(s=>Math.max(s.e,s.d)));
  const cats={};dl.forEach(l=>{const k=l.categoria||'Sem categoria';cats[k]=(cats[k]||0)+Number(l.valor||0);});
  const catL=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const notas=dl.filter(l=>l.itens&&l.itens.length),its=[].concat(...notas.map(l=>l.itens)),itTot=soma(its);
  const grp={};its.forEach(i=>{grp[i.grupo]=(grp[i.grupo]||0)+Number(i.valor||0);});
  const grpL=Object.entries(grp).sort((a,b)=>b[1]-a[1]);
  const porItem={};notas.forEach(l=>l.itens.forEach(i=>{const k=semAcento(i.nome).replace(/\s+/g,' ').trim();const o=porItem[k]=porItem[k]||{nome:i.nome,v:0,n:new Set()};o.v+=Number(i.valor||0);o.n.add(l.id);}));
  const itemL=Object.values(porItem).sort((a,b)=>b.v-a.v).slice(0,10);
  const fix=soma(dl.filter(l=>l.recId)),vari=desp-fix;
  const top=dl.slice().sort((a,b)=>b.valor-a.valor).slice(0,5);
  const per=repN===1?mesNome(mes):mesNome(meses[0],true)+'/'+meses[0].slice(2,4)+' a '+mesNome(mes,true)+'/'+mes.slice(2,4);
  return `
  <div class="chips">${[[1,'Mês'],[3,'3 meses'],[6,'6 meses'],[12,'12 meses']].map(([n,t])=>`<button class="chip ${repN===n?'on':''}" data-act="rep" data-n="${n}">${t}</button>`).join('')}</div>
  <p class="muted" style="margin:4px 4px 0">${esc(per)} · considera o que já foi pago ou recebido</p>
  <div class="card"><div class="duo">
    <div class="stat"><small>Recebido</small><b class="pos">${fmt(ent)}</b></div>
    <div class="stat"><small>Gasto</small><b class="neg">${fmt(desp)}</b></div>
    <div class="stat"><small>Saldo</small><b>${fmt(ent-desp)}</b></div>
    <div class="stat"><small>${repN>1?'Gasto médio por mês':'Lançamentos'}</small><b>${repN>1?fmt(desp/repN):ls.length}</b></div>
  </div></div>
  <div class="card"><h3>Entradas e despesas por mês</h3>
    <div class="bars">${serie.map(s=>`<div class="bcol"><div class="bpair"><i class="e" style="height:${s.e/max*100}%"></i><i class="d" style="height:${s.d/max*100}%"></i></div><small>${mesNome(s.m,true)}</small></div>`).join('')}</div>
    <div class="leg"><span><i style="background:var(--pos)"></i>Entradas</span><span><i style="background:var(--neg)"></i>Despesas</span></div>
    <table class="tbl"><tr><th>Mês</th><th>Entradas</th><th>Despesas</th><th>Saldo</th></tr>
    ${serie.slice().reverse().map(s=>`<tr><td>${mesNome(s.m,true)}/${s.m.slice(2,4)}</td><td>${fmtK(s.e)}</td><td>${fmtK(s.d)}</td><td class="${s.e-s.d>=0?'pos':'neg'}">${s.e-s.d<0?'−':''}${fmtK(Math.abs(s.e-s.d))}</td></tr>`).join('')}</table>
  </div>
  <div class="card"><h3>Despesas por categoria</h3>
    ${catL.map(([k,v])=>`<div class="hb"><div class="top"><span>${esc(k)}</span><span>${fmt(v)} · ${Math.round(v/desp*100)}%</span></div><div class="tr"><i style="width:${v/catL[0][1]*100}%"></i></div></div>`).join('')||'<div class="empty">Sem despesas no período.</div>'}
  </div>
  ${notas.length?`<div class="card"><h3>Compras com nota, por grupo</h3>

}

function updBusca(){
  const el=$('#bLista');if(!el)return;
  const t=busca.t.trim().toLowerCase();
  const achados=l=>t&&l.itens?l.itens.filter(i=>semAcento(i.nome).includes(semAcento(t))):[];
  const r=lancs.filter(l=>(!t||String(l.descricao).toLowerCase().includes(t)||achados(l).length)&&(!busca.cat||l.categoria===busca.cat)
    &&(!busca.de||l.mes>=busca.de)&&(!busca.ate||l.mes<=busca.ate)&&(busca.tipo==='todos'||l.tipo===busca.tipo))
    .sort((a,b)=>b.data.localeCompare(a.data));
  const e=soma(r.filter(l=>l.tipo==='entrada')),d=soma(r.filter(l=>l.tipo==='despesa'));
  const itTot=r.reduce((a,l)=>a+soma(achados(l)),0),soItens=r.length&&r.every(l=>achados(l).length&&!String(l.descricao).toLowerCase().includes(t));
  $('#bTot').textContent=r.length?(soItens?'itens encontrados '+fmt(itTot):(d?'despesas '+fmt(d):'')+(d&&e?' · ':'')+(e?'entradas '+fmt(e):'')):'';
  el.innerHTML=r.slice(0,300).map(l=>linhaLanc(l,achados(l).slice(0,6).map(i=>`<div class="rs">↳ ${esc(i.nome)}${i.qtd&&i.qtd!==1?' ('+esc(String(i.qtd).replace('.',','))+')':''} · ${fmt(i.valor)}</div>`).join(''))).join('')||'<div class="empty">Nada encontrado.</div>';
}
function render(){
  $('#mesTitulo').textContent=mesNome(mes);
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.aba===aba));
  const v=$('#view'),foco=document.activeElement&&document.activeElement.id;
  if(aba==='busca'&&$('#bLista')){updBusca();return;}
  if(aba==='mes'&&foco==='simIn'&&$('#simOut')){updSim();return;}
  v.innerHTML=aba==='mes'?viewMes():aba==='fixos'?viewFixos():aba==='rel'?viewRel():viewBusca();
  if(aba==='mes')updSim();
  if(aba==='busca')updBusca();
}

/* ---------- boleto ---------- */
function mod10(s){let soma=0,p=2;for(let i=s.length-1;i>=0;i--){const n=Number(s[i])*p;soma+=n>9?n-9:n;p=p===2?1:2;}const r=soma%10;return r===0?0:10-r;}
function mod11banc(s){let soma=0,p=2;for(let i=s.length-1;i>=0;i--){soma+=Number(s[i])*p;p=p===9?2:p+1;}const dv=11-soma%11;return(dv===0||dv===10||dv===11)?1:dv;}
function mod11arrec(s){let soma=0,p=2;for(let i=s.length-1;i>=0;i--){soma+=Number(s[i])*p;p=p===9?2:p+1;}const r=soma%11;return(r===0||r===1)?0:(r===10?1:11-r);}
function vencFator(f){
  if(!f)return null;
  const dia=864e5,a=Date.UTC(1997,9,7)+f*dia,b=Date.UTC(2022,4,29)+f*dia,hoje=Date.now();
  const alvo=(f<1000||Math.abs(a-hoje)<=Math.abs(b-hoje))?a:b;
  return new Date(alvo).toISOString().slice(0,10);
}
function formatarCodigo(cod){
  const d=String(cod||'').replace(/\D/g,'');
  if(d.length===47)return `${d.slice(0,5)}.${d.slice(5,10)} ${d.slice(10,15)}.${d.slice(15,21)} ${d.slice(21,26)}.${d.slice(26,32)} ${d[32]} ${d.slice(33)}`;
  if(d.length===48)return [0,12,24,36].map(i=>d.slice(i,i+11)+'-'+d[i+11]).join(' ');
  return d;
}
/* devolve {ok, tipo, valor, venc} quando a linha digitável passa nos dígitos verificadores */
function lerBoleto(txt){
  const d=String(txt||'').replace(/\D/g,'');
  if(d.length===47){
    for(const c of [d.slice(0,10),d.slice(10,21),d.slice(21,32)])if(mod10(c.slice(0,-1))!==Number(c.slice(-1)))return{ok:false};
    const bc=d.slice(0,4)+d[32]+d.slice(33)+d.slice(4,9)+d.slice(10,20)+d.slice(21,31);
    if(mod11banc(bc.slice(0,4)+bc.slice(5))!==Number(bc[4]))return{ok:false};
    return{ok:true,tipo:'banco',valor:Number(d.slice(37))/100,venc:vencFator(Number(d.slice(33,37)))};
  }
  if(d.length===48&&d[0]==='8'){
    const mod=(d[2]==='6'||d[2]==='7')?mod10:mod11arrec;
    const blocos=[0,12,24,36].map(i=>d.slice(i,i+12));
    for(const b of blocos)if(mod(b.slice(0,11))!==Number(b[11]))return{ok:false};
    const bc=blocos.map(b=>b.slice(0,11)).join('');
    if(mod(bc.slice(0,3)+bc.slice(4))!==Number(bc[3]))return{ok:false};
    return{ok:true,tipo:'conta',valor:(d[2]==='6'||d[2]==='8')?Number(bc.slice(4,15))/100:0,venc:null};
  }
  return{ok:false};
}
function atualizarCodInfo(){
  const i=$('#codIn'),box=$('#codInfo');if(!i||!box)return;
  const d=i.value.replace(/\D/g,'');
  if(!d){box.textContent='';box.className='info';return;}
  const r=lerBoleto(d);
  if(r.ok){
    const p=[];if(r.valor>0)p.push(fmt(r.valor));if(r.venc)p.push('vence '+dataBR(r.venc));
    box.textContent='✓ Código conferido'+(p.length?' · '+p.join(' · '):'');box.className='info ok';
  }else{
    box.textContent='⚠ Esse código não passou na conferência. Compare com o boleto antes de pagar.';box.className='info aviso';
  }
}
async function copiarTexto(txt){
  try{await navigator.clipboard.writeText(txt);return true;}
  catch(e){
    try{const t=document.createElement('textarea');t.value=txt;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok;}
    catch(_){return false;}
  }
}

/* ---------- itens da nota ---------- */
function limparItens(arr){
  return (Array.isArray(arr)?arr:[]).map(i=>({nome:String(i&&i.nome||'').trim().slice(0,60),qtd:Number(i&&i.qtd)>0?Math.round(Number(i.qtd)*1000)/1000:null,
    valor:Math.round(Number(i&&i.valor||0)*100)/100,grupo:GRUPOS.includes(i&&i.grupo)?i.grupo:'Outros'})).filter(i=>i.nome&&i.valor>0).slice(0,300);
}
function confereItens(itens,total){
  const sm=Math.round(soma(itens)*100)/100,dif=Math.round((Number(total||0)-sm)*100)/100;
  return Math.abs(dif)<=0.05?{ok:true,txt:'✓ A soma dos itens bate com o total ('+fmt(sm)+').'}
    :{ok:false,txt:'⚠ Os itens somam '+fmt(sm)+' e o total é '+fmt(total)+' (diferença de '+fmt(Math.abs(dif))+'). Pode ser desconto ou item que não foi lido.'};
}
function itensAgrupados(itens){
  const g={};itens.forEach(i=>{(g[i.grupo]=g[i.grupo]||[]).push(i);});
  return Object.entries(g).sort((a,b)=>soma(b[1])-soma(a[1])).map(([nome,ls])=>`<div class="gh"><span>${esc(nome)}</span><span>${fmt(soma(ls))}</span></div>`+
    ls.map(i=>`<div class="it"><span>${esc(i.nome)}${i.qtd&&i.qtd!==1?` <small>× ${esc(String(i.qtd).replace('.',','))}</small>`:''}</span><b>${fmt(i.valor)}</b></div>`).join('')).join('');
}

/* ---------- leitura com IA ---------- */
function arquivoBase64(file){return new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(String(r.result));r.onerror=err;r.readAsDataURL(file);});}
async function lerComIA(files){
  files=[...files].slice(0,4);const file=files[0];
  const btn=$('#iaBtn'),f=$('#fLanc');if(!btn||!f)return;
  if(!window.GEMINI_KEY){toast('Falta cadastrar a chave da IA. Vá em Fixos e toque em Chave da IA.');return;}
  const txt=btn.firstChild.textContent;btn.classList.add('lendo');btn.firstChild.textContent=files.length>1?'Lendo '+files.length+' arquivos…':'Lendo o arquivo…';
  try{
    const pdf=file.type==='application/pdf';
    const arqs=[];
    for(const a of files){
      if(a.type==='application/pdf'){if(a.size>15e6)throw new Error('grande');arqs.push({dataUrl:await arquivoBase64(a),mime:'application/pdf'});}
      else arqs.push({dataUrl:await comprimir(a),mime:'image/jpeg'});
    }
    const r=await window.lerContaIA(arqs,CATS,GRUPOS);
    const cod=String(r&&r.codigo||'').replace(/\D/g,'');
    const bol=cod?lerBoleto(cod):null;
    if(r&&bol&&bol.ok){if(bol.valor>0)r.valor=bol.valor;if(bol.venc)r.data=bol.venc;r.tipo='despesa';}
    if(!r||!(Number(r.valor)>0)){toast('Não achei o valor nesse arquivo. Preencha à mão.');return;}
    const el=f.elements;
    el.valor.value=Number(r.valor).toFixed(2).replace('.',',');
    if(r.descricao)el.desc.value=String(r.descricao).slice(0,60);
    const d=/^\d{4}-\d{2}-\d{2}$/.test(r.data||'')?r.data:null;if(d)el.data.value=d;
    if(sheetCtx&&!sheetCtx.recId&&(r.tipo==='entrada'||r.tipo==='despesa')&&r.tipo!==sheetCtx.tipo){const b=f.querySelector(`[data-act=segTipo][data-tipo=${r.tipo}]`);if(b)b.click();}
    if(el.cat&&CATS.includes(r.categoria))el.cat.value=r.categoria;
    if(!pdf&&el.print&&!(el.aberto&&el.aberto.checked)){try{const dt=new DataTransfer();dt.items.add(file);el.print.files=dt.files;}catch(e){}}
    if(el.aberto)el.aberto.checked=(r.tipo!=='entrada')&&(r.situacao?r.situacao==='aberto':!!(bol&&bol.ok));
    if(cod&&el.codigo){el.codigo.value=formatarCodigo(cod);atualizarCodInfo();}
    const itens=limparItens(r.itens);if(sheetCtx)sheetCtx.itens=itens.length?itens:null;mostrarItensLidos(itens,r.valor);
    toast(itens.length?(confereItens(itens,r.valor).ok?'Nota lida com '+itens.length+' itens. Revise e toque em Salvar.':'Li '+itens.length+' itens, mas a soma não bate com o total. Confira antes de salvar.'):!cod?'Conferi os campos. Revise e toque em Salvar.':(bol&&bol.ok?'Boleto lido e código conferido. Revise e toque em Salvar.':'Li o boleto, mas o código não passou na conferência. Compare antes de pagar.'));
  }catch(e){
    toast(e&&e.message==='grande'?'Arquivo grande demais. Mande uma foto ou print.':'Não consegui ler esse arquivo. Tente uma foto mais nítida.');
  }finally{btn.classList.remove('lendo');btn.firstChild.textContent=txt;}
}

    if(confirmar!==el){confirmar=el;el.textContent='Toque de novo para confirmar';setTimeout(()=>{if(confirmar===el)confirmar=null;},4000);return;}
    confirmar=null;
    try{await store.del(act==='delLanc'?'lanc':'rec',id);fecharSheet();trocar();}
    catch(e){toast('Não consegui apagar. Tente de novo.');}
  }
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();
  if(ev.target.id==='fLanc')salvarLanc(ev.target);
  if(ev.target.id==='fRec')salvarRec(ev.target);
  if(ev.target.id==='fChave')salvarChave(ev.target);
  if(ev.target.id==='fItens')salvarItens(ev.target);
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='simIn'){sim=t.value;updSim();}
  else if(t.id==='codIn')atualizarCodInfo();
  else if(t.id==='bT'){busca.t=t.value;updBusca();}
  else if(t.id==='bCat'){busca.cat=t.value;updBusca();}
  else if(t.id==='bTipo'){busca.tipo=t.value;updBusca();}
  else if(t.id==='bDe'){busca.de=t.value;updBusca();}
  else if(t.id==='bAte'){busca.ate=t.value;updBusca();}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='iaFile'&&ev.target.files[0]){lerComIA(ev.target.files);ev.target.value='';return;}
  if(ev.target.id==='fImport'&&ev.target.files[0]){importar(ev.target.files[0]);ev.target.value='';}
});

iniciar();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script>
/* A chave do Gemini vem de window.GEMINI_KEY (definida fora deste arquivo). */
const MODELOS=['gemini-3.5-flash','gemini-3-flash-preview','gemini-3.1-flash-lite','gemini-3.8-flash'];
window.lerContaIA=async(arqs,cats,grupos)=>{
  if(!window.GEMINI_KEY)throw new Error('sem chave');
  const hoje=new Date().toISOString().slice(0,10);
  const prompt=`Você lê contas, boletos, faturas e comprovantes de pagamento brasileiros para um app de finanças da casa. Hoje é ${hoje}.
Devolva:
- descricao: nome curto de quem recebe ou do serviço, como "Conta de água Sabesp", "Escola", "Licenciamento". Até 40 caracteres.
- valor: o valor total a pagar ou pago, em reais, como número (ex.: 187.43). Ignore consumo, leituras e valores parciais.
- data: se for comprovante de pagamento, a data em que foi pago; se for conta ou boleto, a data de vencimento. Formato AAAA-MM-DD.
- tipo: "despesa", ou "entrada" se for dinheiro recebido (salário, Pix recebido).
- situacao: "pago" se for comprovante de pagamento, recibo ou Pix já feito; "aberto" se for boleto, fatura ou conta que ainda precisa ser paga.
- categoria: a que melhor encaixa.
- codigo: se for boleto ou conta com linha digitável, copie a linha digitável inteira, só os números, exatamente como está impressa, sem inventar nem completar dígitos (47 dígitos em boleto bancário, 48 em conta de água, luz, gás, telefone ou imposto). Se não houver linha digitável legível, deixe vazio.
- itens: só quando for nota ou cupom fiscal de compra com produtos listados (mercado, farmácia, padaria, loja). Liste todos os produtos, um por linha da nota, sem pular nenhum e sem inventar. Para cada um: nome (escreva por extenso o que der para entender da abreviação, ex.: "LEITE UHT INT 1L" vira "Leite integral 1L"), qtd (quantidade ou peso em kg, como número), valor (valor total daquele item em reais, já multiplicado pela quantidade e com o desconto do próprio item) e grupo. Não inclua como item: descontos gerais, troco, formas de pagamento, impostos nem o total. Se houver mais de uma imagem, elas são partes da mesma nota: junte os itens sem repetir os que aparecem nas duas. Nesse caso use a categoria "Mercado" quando for supermercado, e descricao com o nome do estabelecimento. Em contas, boletos e comprovantes sem lista de produtos, devolva itens vazio.`;
  const corpo={contents:[{parts:[{text:prompt}].concat(arqs.map(a=>({inline_data:{mime_type:a.mime,data:a.dataUrl.split(',')[1]}})))}],
    generationConfig:{responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{
      descricao:{type:'STRING'},valor:{type:'NUMBER'},data:{type:'STRING'},tipo:{type:'STRING',enum:['despesa','entrada']},situacao:{type:'STRING',enum:['pago','aberto']},categoria:{type:'STRING',enum:cats},codigo:{type:'STRING'},
      itens:{type:'ARRAY',items:{type:'OBJECT',properties:{nome:{type:'STRING'},qtd:{type:'NUMBER'},valor:{type:'NUMBER'},grupo:{type:'STRING',enum:grupos}},required:['nome','valor','grupo']}}}}}};
  let ultimo;
  for(const m of (window.MODELO_OK?[window.MODELO_OK].concat(MODELOS.filter(x=>x!==window.MODELO_OK)):MODELOS)){
    try{
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':window.GEMINI_KEY},body:JSON.stringify(corpo)});
      if(r.ok){
        const j=await r.json();
        const t=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');
        window.MODELO_OK=m;return JSON.parse(t);
      }
      ultimo=new Error('HTTP '+r.status);
      if(![404,429,500,503].includes(r.status))throw ultimo;
    }catch(e){ultimo=e;if(!/^HTTP (404|429|500|503)$/.test(String(e&&e.message))&&!(e instanceof TypeError))throw e;}
  }
  throw ultimo;
};
